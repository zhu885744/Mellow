<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁大方的三栏轻量博客主题" />
    <title>朱某的生活印记</title>
    <script>
      // 防闪烁：渲染前根据本地设置/系统偏好预设主题
      (function () {
        try {
          var m = localStorage.getItem('mellow_theme') || 'auto'
          var dark = m === 'dark' ||
            (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch (e) { /* ignore */ }
      })()
    </script>
    <!-- 运行时配置：部署到后端 public 目录后，可直接改 runtime-config.js 指定后端地址，无需重新打包 -->
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
